[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fastfiles"
version = "0.2.0"
description = "A friendly desktop UI for fast rsync-over-SSH file transfers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "zeroconf>=0.136,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1"]
desktop = [
    "PySide6>=6.7,<7",
    "keyring>=25,<26",
    "qt-material>=2.17,<3",
]

[project.scripts]
fastfiles = "fastfiles.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fastfiles"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
