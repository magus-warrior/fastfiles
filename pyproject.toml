[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fastfiles"
version = "0.1.0"
description = "A friendly desktop UI for fast rsync-over-SSH file transfers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
    "keyring>=25,<26",
    "qt-material>=2.17,<3",
    "zeroconf>=0.136,<1",
]

[project.scripts]
fastfiles = "fastfiles.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fastfiles"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
